name: Open Stage Control
on:
  workflow_call:
  pull_request:
    paths: ['integrations/open-stage-control/**', 'test/open_stage_control*', 'src/engine/OscShowControl.cpp', '.github/scripts/package_open_stage_control.py', '.github/workflows/open-stage-control.yml']
  push:
    branches: [main]
    paths: ['integrations/open-stage-control/**', 'test/open_stage_control*', 'src/engine/OscShowControl.cpp', '.github/scripts/package_open_stage_control.py', '.github/workflows/open-stage-control.yml']
  workflow_dispatch:
concurrency:
  group: open-stage-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the committed portable dependency bundle
        working-directory: integrations/open-stage-control
        run: |
          npm ci --ignore-scripts --omit=optional
          npm run check:dependencies
      - name: Package ready-to-load files outside the checkout
        run: python3 .github/scripts/package_open_stage_control.py "$RUNNER_TEMP/controller-pack"
      - name: Protocol, isolated runtime and session checks
        run: |
          npm install --prefix "$RUNNER_TEMP/controller-deps" --no-save ws@8 osc@2.4.5 playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/controller-deps/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/controller-deps/node_modules" node --test test/open_stage_control.test.cjs test/open_stage_control_runtime.cjs
          "$RUNNER_TEMP/controller-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build the official Open Stage Control client
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          git clone https://framagit.org/jean-emmanuel/open-stage-control.git "$RUNNER_TEMP/open-stage-control"
          cd "$RUNNER_TEMP/open-stage-control"
          git checkout a47050e7ad31284553cca60441015f79b95cc5e0
          npm ci --ignore-scripts
          npm run build
      - name: Exercise the actual controller UI
        run: |
          node test/open_stage_control_fixture.cjs > "$RUNNER_TEMP/pinol-fixture.log" 2>&1 &
          NODE_PATH='' node "$RUNNER_TEMP/open-stage-control/app" --no-gui --port 8080 --osc-port 11111 \
            --custom-module "$RUNNER_TEMP/controller-pack/Pinol-OpenStageControl/pinol.js" \
            --load "$RUNNER_TEMP/controller-pack/Pinol-OpenStageControl/pinol.json" > "$RUNNER_TEMP/open-stage-control.log" 2>&1 &
          node test/open_stage_control_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Pinol-OpenStageControl
          path: ${{ runner.temp }}/controller-pack/Pinol-OpenStageControl.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-stage-control
          path: |
            ${{ runner.temp }}/pinol-controller-*.png
            ${{ runner.temp }}/open-stage-control.log
            ${{ runner.temp }}/pinol-fixture.log
