name: Release metadata

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

concurrency:
  group: release-metadata
  cancel-in-progress: false

jobs:
  update:
    name: Synchronize downloads and source version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Update from the latest complete published release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A concurrent main commit is preserved: retry from its new head,
          # regenerate, and use an ordinary fast-forward push, never force.
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"
            python3 .github/scripts/release_metadata.py
            if git diff --quiet -- README.md VERSION; then exit 0; fi
            git add README.md VERSION
            git commit -m 'docs: synchronize published downloads and version'
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
          done
          echo 'Could not update release metadata after three attempts' >&2
          exit 1
