[project]
site_name = "NyxMap"
site_description = "Real-time projection mapping and show composition instrument"
site_url = "https://pixelstereo.github.io/NyxMap/"
repo_url = "https://github.com/PixelStereo/NyxMap"
repo_name = "PixelStereo/NyxMap"
edit_uri = "edit/main/docs/"
copyright = "NyxMap is free software under the GNU AGPL v3 or later"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install and launch" = "getting-started/install.md" },
    { "Concepts" = "getting-started/concepts.md" },
  ] },
  { "Visuals" = [
    { "Media sources" = "visuals/media.md" },
    { "Generators" = "visuals/generators.md" },
    { "3D scenes" = "visuals/3d-scenes.md" },
    { "Pixel mapping (DMX)" = "visuals/pixel-mapping.md" },
  ] },
  { "Audio" = [
    { "Audio generators" = "audio/generators.md" },
    { "Audio effects" = "audio/effects.md" },
  ] },
  { "Control" = [
    { "Parameter control" = "control/parameters.md" },
    { "Animations" = "control/animations.md" },
    { "Clock and envelopes" = "control/clock-and-envelopes.md" },
    { "Vision interactions" = "control/vision.md" },
  ] },
  { "Show" = [
    { "Snapshots, presets and sequences" = "show/editing.md" },
    { "Controls and remote" = "show/controls-and-remote.md" },
  ] },
  { "Integrations" = [
    { "Stream Deck (Companion)" = "integrations/companion.md" },
    { "TouchDesigner" = "integrations/touchdesigner.md" },
  ] },
  { "Reference" = [
    { "OSC API" = "reference/osc.md" },
  ] },
  { "Developers" = [
    { "Build from source" = "developers/build.md" },
    { "Linux packaging" = "developers/linux-packaging.md" },
    { "Video pipeline" = "developers/video-pipeline.md" },
    { "Audio engine selection" = "developers/audio-engine.md" },
  ] },
  { "Project" = [
    { "Limitations" = "project/limitations.md" },
    { "Roadmap" = "project/roadmap.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
